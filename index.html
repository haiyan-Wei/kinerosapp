<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINEROS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f7f7f5;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      line-height: 1.5;
    }
    .logo {
      max-width: 280px;
      width: 100%;
      height: auto;
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }
    p {
      max-width: 36rem;
      font-size: 1.05rem;
      color: #444;
      margin-bottom: 1.5rem;
    }
    .note {
      font-size: 0.95rem;
      color: #666;
      font-style: italic;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <img src="kineros2.jpg" alt="KINEROS logo" class="logo">

  <h1>KINEROS</h1>

  <p>
    The kinematic runoff and erosion model KINEROS is an event-oriented,
    physically based model describing the processes of interception,
    infiltration, surface runoff and erosion from small agricultural and
    urban watersheds.
  </p>

  <p class="note">More to come — stay tuned</p>
</body>
</html>
